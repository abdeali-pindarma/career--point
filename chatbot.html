<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Career Guidance Assistant</title>
    <link rel="stylesheet" href="chatbot.css">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
</head>

<body>
    <div class="app-container">
        <!-- Header -->
        <header class="app-header">
            <a href="dashboard.html"><button class="dashboard-btn" id="dashboardBtn">
            <i class="fas fa-arrow-left"></i> Back to Dashboard
            </button></a>
            <h1 class="app-title">
                <i class="fas fa-robot"></i> AI Career Guide
            </h1>
            <a href="career suitable.html"><button class="more-careers-btn" id="moreCareersBtn"> More Careers
            <i class="fas fa-briefcase"></i>
            </button></a>
        </header>

        <!-- Chat Container -->
        <div class="chat-container" id="chatContainer">
            <div class="chat-messages" id="chatMessages">
                <!-- Messages will be dynamically added here -->
            </div>

            <!-- Typing Indicator -->
            <div class="typing-indicator" id="typingIndicator">
                <div class="typing-dots">
                    <span></span>
                    <span></span>
                    <span></span>
                </div>
                <span class="typing-text">AI is thinking...</span>
            </div>
        </div>

        <!-- Assessment Progress -->
        <div class="progress-container" id="progressContainer">
            <div class="progress-bar">
                <div class="progress-fill" id="progressFill"></div>
            </div>
            <span class="progress-text" id="progressText">Assessment Progress: 0%</span>
        </div>

        <!-- Input Area -->
        <div class="input-area" id="inputArea">
            <div class="quick-replies" id="quickReplies">
                <!-- Quick reply buttons will be added dynamically -->
            </div>
            <div class="input-container">
                <input type="text" id="messageInput" placeholder="Type your message..." disabled>
                <button class="send-btn" id="sendBtn" disabled>
                    <i class="fas fa-paper-plane"></i>
                </button>
            </div>
        </div>

        <!-- Career Cards Container -->
        <div class="career-cards-container" id="careerCardsContainer">
            <!-- Career recommendation cards will be added here -->
        </div>

        <!-- Restart Button -->
        <button class="restart-btn" id="restartBtn">
            <i class="fas fa-redo"></i>
            Restart Assessment
        </button>
    </div>

    <!-- Background Particles -->
    <div class="particles" id="particles"></div>

    <script src="chatbot.js"></script>
</body>

</html>
